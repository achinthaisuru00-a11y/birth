<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Angelina's 3D Surprise</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>

    <script>
        // තෑගි පෙට්ටිය Click කරාම වෙන දේ
        AFRAME.registerComponent('gift-logic', {
            init: function () {
                let box = this.el;
                let photo = document.querySelector('#angelina-photo');
                let audio = document.querySelector('#voice-msg');
                let instruction = document.querySelector('#instruction-text');

                box.addEventListener('click', function () {
                    // පෙට්ටිය සහ උපදෙස් අකුරු හංගනවා
                    box.setAttribute('visible', 'false');
                    instruction.setAttribute('visible', 'false');

                    // ෆොටෝ එක මතු කරනවා
                    photo.setAttribute('visible', 'true');
                    photo.setAttribute('animation', 'property: scale; from: 0 0 0; to: 3 3 3; dur: 1500; easing: easeOutElastic');

                    // Audio Play කරනවා
                    audio.play();
                });
            }
        });
    </script>
</head>
<body>

    <a-scene vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">

        <a-assets>
            <img id="my-photo" src="angelina.jpg">
            <audio id="voice-msg" src="your-voice.mp3"></audio>
        </a-assets>

        <a-sky color="#1a1a2e"></a-sky>

        <a-entity camera look-controls="enabled: false" 
                  orbit-controls="target: 0 0 0; minDistance: 2; maxDistance: 8; initialPosition: 0 1.5 4">
        </a-entity>

        <a-entity position="0 0 0">
            
            <a-box position="0 0 0" 
                   material="color: #ff4d4d; metalness: 0.4; roughness: 0.2;" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
                   class="clickable"
                   gift-logic>
            </a-box>

            <a-text id="instruction-text" 
                    value="Swipe to look around!\nTap the box to Open" 
                    align="center" 
                    position="0 1.2 0" 
                    color="#ffffff"
                    scale="0.8 0.8 0.8">
            </a-text>

            <a-image id="angelina-photo" 
                     src="#my-photo" 
                     position="0 0 0" 
                     visible="false">
            </a-image>

        </a-entity>

    </a-scene>

</body>
</html>
