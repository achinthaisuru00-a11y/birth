<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Real AR Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <style>
        body, html { margin: 0; overflow: hidden; background-color: black; font-family: -apple-system, sans-serif; }
        
        /* පසුබිමේ කැමරාව */
        #bg-camera { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        
        /* 3D ලෝකය කැමරාවට උඩින් */
        #ar-scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .a-canvas { pointer-events: auto !important; } /* Click කරන්න අවසර දීම */

        /* iPhone එකට Sensors ඉල්ලන Start Screen එක */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .start-btn { 
            padding: 15px 40px; font-size: 20px; background: #ff4d4d; color: white; 
            border: none; border-radius: 30px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,77,77,0.5);
        }
    </style>

    <script>
        // තෑගි පෙට්ටියේ Logic එක
        AFRAME.registerComponent('gift-logic', {
            init: function () {
                let box = this.el;
                let photo = document.querySelector('#photo');
                let audio = document.querySelector('#audio');

                box.addEventListener('click', function () {
                    box.setAttribute('visible', 'false');
                    photo.setAttribute('visible', 'true');
                    photo.setAttribute('animation', 'property: scale; from: 0 0 0; to: 2 2 2; dur: 1500; easing: easeOutElastic');
                    audio.play();
                });
            }
        });

        // iPhone එකෙන් Camera සහ Gyroscope අවසර ගන්න Function එක
        function startRealAR() {
            // 1. කැමරාව ඔන් කිරීම
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { document.getElementById('bg-camera').srcObject = stream; })
            .catch(err => alert("Please allow camera access!"));

            // 2. iPhone Gyroscope (DeviceOrientation) අවසරය ගැනීම
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        // අවසර ලැබුණොත් Start screen එක අයින් කරනවා
                        document.getElementById('start-screen').style.display = 'none';
                    } else {
                        alert("We need sensor access for the AR magic!");
                    }
                }).catch(console.error);
            } else {
                // වෙනත් ෆෝන් වලට (Android වගේ) කෙලින්ම යන්න දෙනවා
                document.getElementById('start-screen').style.display = 'none';
            }
        }
    </script>
</head>
<body>

    <div id="start-screen">
        <h1 style="margin-bottom: 10px;">Ready for a Surprise? 🎁</h1>
        <p style="font-size: 18px; color: #ddd;">Hold your phone up and look around!</p>
        <button class="start-btn" onclick="startRealAR()">Start AR Magic</button>
    </div>

    <video id="bg-camera" autoplay muted playsinline></video>

    <div id="ar-scene">
        <a-scene background="transparent: true" vr-mode-ui="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
            
            <a-assets>
                <img id="my-photo" src="angelina.jpg">
                <audio id="audio" src="your-voice.mp3"></audio>
            </a-assets>

            <a-camera position="0 1.6 0" look-controls="enabled: true"></a-camera>

            <a-box position="0 0 -3" 
                   material="color: #ff4d4d; metalness: 0.3; roughness: 0.4;" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   class="clickable" 
                   gift-logic>
            </a-box>

            <a-image id="photo" src="#my-photo" position="0 1 -3" visible="false"></a-image>

        </a-scene>
    </div>

</body>
</html>
